<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aventura Matemàtica - Practica les Taules</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap');
        
        body {
            font-family: 'Fredoka', sans-serif;
            background: #f0f9ff;
            touch-action: manipulation;
            overflow: hidden; /* Evita el scroll durant el joc */
            height: 100vh;
        }

        .header-bg { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); }

        @keyframes floatUp {
            from { transform: translateY(110vh); opacity: 1; }
            to { transform: translateY(-20vh); opacity: 0; }
        }
        
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(2px);
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #4f46e5;
            animation: floatUp 7s linear forwards;
            cursor: pointer;
            z-index: 10;
            transition: background 0.2s, transform 0.2s;
            font-size: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Efecte de pols per quan explota la bombolla */
        .bubble-pop {
            transform: scale(1.5);
            opacity: 0;
            transition: all 0.3s ease-out;
        }

        .setup-btn {
            transition: all 0.2s;
            border-bottom: 4px solid #c7d2fe;
        }
        .setup-btn:active {
            transform: translateY(2px);
            border-bottom-width: 0;
        }
    </style>
</head>
<body class="flex flex-col">

    <header class="header-bg p-4 text-white shadow-lg flex justify-between items-center relative z-50">
        <div class="flex items-center gap-3">
            <div class="bg-white p-2 rounded-xl text-indigo-600 shadow-inner">
                <i class="fas fa-rocket text-xl"></i>
            </div>
            <h1 class="text-xl md:text-2xl font-bold tracking-tight">Aventura Matemàtica</h1>
        </div>
        <div id="score-container" class="bg-yellow-400 text-yellow-900 px-6 py-2 rounded-full font-bold shadow-md flex items-center gap-2">
            <i class="fas fa-star"></i>
            <span>Punts: <span id="score">0</span></span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 relative overflow-hidden">
        
        <div id="setup-screen" class="bg-white p-8 rounded-3xl shadow-2xl text-center z-50 max-w-md w-full border-4 border-indigo-100">
            <h2 class="text-3xl mb-6 text-indigo-900 font-bold">Quina taula vols practicar avui?</h2>
            <div class="grid grid-cols-3 gap-4 mb-8">
                <script>
                    for(let i=1; i<=9; i++) {
                        document.write(`
                            <button onclick="startGame(${i})" class="setup-btn bg-indigo-50 hover:bg-indigo-500 hover:text-white text-indigo-700 font-bold py-4 rounded-2xl text-xl">
                                ${i}
                            </button>
                        `);
                    }
                </script>
            </div>
            <p class="text-indigo-400 text-sm italic">Tria un número per començar l'aventura!</p>
        </div>

        <div id="game-screen" class="hidden text-center z-20">
            <div class="bg-white/80 backdrop-blur-sm p-10 rounded-3xl shadow-2xl mb-8 border-4 border-white">
                <p class="text-indigo-400 text-lg uppercase tracking-widest font-bold mb-2">Explota la resposta!</p>
                <div id="question" class="text-7xl md:text-8xl font-bold text-indigo-600">5 x 5</div>
            </div>
        </div>

    </main>

    <script>
        let currentTable = 1;
        let correctAnswer = 0;
        let score = 0;
        let bubblesSinceLastCorrect = 0;
        let gameInterval;

        function startGame(table) {
            currentTable = table;
            score = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            nextQuestion();
            // Comença a generar bombolles
            gameInterval = setInterval(createBubble, 1400);
        }

        function nextQuestion() {
            const multiplier = Math.floor(Math.random() * 10) + 1;
            correctAnswer = currentTable * multiplier;
            document.getElementById('question').innerText = `${currentTable} x ${multiplier}`;
            bubblesSinceLastCorrect = 0; // Reiniciem el comptador per a la nova pregunta
        }

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            bubblesSinceLastCorrect++;

            let value;
            // LÒGICA DE FREQÜÈNCIA:
            // Entre 3 i 5 bombolles hi ha probabilitat creixent. 
            // A la 6a bombolla, forcem que surti la correcta.
            const forceCorrect = bubblesSinceLastCorrect >= 6;
            const randomChance = bubblesSinceLastCorrect >= 3 && Math.random() > 0.4;

            if (forceCorrect || randomChance) {
                value = correctAnswer;
                bubblesSinceLastCorrect = 0; // Reset per esperar a la següent aparició
            } else {
                // Genera una resposta incorrecta creïble (a prop del resultat o aleatòria)
                const offset = Math.floor(Math.random() * 10) + 1;
                value = Math.random() > 0.5 ? correctAnswer + offset : Math.max(0, correctAnswer - offset);
                if (value === correctAnswer) value += 2;
            }
            
            bubble.innerText = value;
            
            // Grandària i posició aleatòria
            const size = Math.floor(Math.random() * 20) + 80; 
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${Math.random() * 75 + 10}vw`; // Marge del 10% als costats
            
            // Velocitat de pujada
            bubble.style.animationDuration = `${Math.random() * 2 + 5}s`;

            bubble.onclick = () => {
                if (parseInt(bubble.innerText) === correctAnswer) {
                    // ENCERT
                    score += 10;
                    document.getElementById('score').innerText = score;
                    bubble.style.background = "#4ade80"; 
                    bubble.style.borderColor = "#22c55e";
                    bubble.classList.add('bubble-pop');
                    
                    // Netejar bombolles actuals i següent pregunta
                    setTimeout(() => {
                        const allBubbles = document.querySelectorAll('.bubble');
                        allBubbles.forEach(b => b.remove());
                        nextQuestion();
                    }, 400);
                } else {
                    // ERROR
                    bubble.style.background = "#f87171";
                    bubble.style.borderColor = "#dc2626";
                    bubble.style.color = "white";
                    setTimeout(() => bubble.remove(), 300);
                }
            };

            document.body.appendChild(bubble);

            // Neteja si la bombolla surt per dalt sense ser clicada
            setTimeout(() => {
                if(bubble.parentNode) bubble.remove();
            }, 7000);
        }
    </script>
</body>
</html>
